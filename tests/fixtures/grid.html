<style>
    /* 걸린다 */
    .lanes { grid-template-rows: auto minmax(0, 1fr); }
    .side { grid-template-columns: minmax(auto, 20rem) 1fr; }
    .fit { grid-template-rows: fit-content(10rem) 2fr; }
    .short { grid-template: auto 1fr / 1fr; }
    /* 걸리지 않는다 */
    .ok-rows { grid-template-rows: max-content minmax(0, 1fr); }
    .ok-cols { grid-template-columns: minmax(min-content, max-content) 1fr; }
    .no-fr { grid-template-columns: auto auto; }
    .flow { grid: auto-flow / 1fr 1fr; }
    /* grid-template-rows: auto 1fr; — 주석은 보지 않는다 */
</style>
<div style="display:grid; grid-template-rows: auto 1fr"></div>
<div class="grid grid-rows-[auto_1fr]"></div>
<div class="grid grid-cols-[max-content_1fr]"></div>
<script>
    el.style.gridTemplateRows = 'auto 1fr';
    Object.assign(el.style, {gridTemplateColumns: `1fr auto`});
    el.style.setProperty('grid-template-columns', '2fr auto');
    el.style.gridTemplateRows = `repeat(${n}, minmax(0, 1fr))`;
</script>
<style>
    .stage { grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 64em) { .under { grid-template-columns: 2fr 1fr; } }
    .both { grid-template: 1fr / 1fr; }
    #heavy .run { grid-template-columns: 1fr 1fr; }
</style>
<!-- 걸린다 -->
<div class="stage grid grid-cols-1 gap-4"></div>
<div class="under grid lg:grid-cols-3"></div>
<div class="both grid grid-rows-2"></div>
<!-- 걸리지 않는다 — 무거운 선택자 · 다른 축 · 유틸리티 없음 -->
<div class="run grid grid-cols-1"></div>
<div class="stage grid grid-rows-2"></div>
<div class="stage gap-4"></div>
