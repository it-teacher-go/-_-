<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>색을 박은 조각</title>
    <style>
        /* 주석 속 #ffffff 는 걸리지 않는다 */
        .card { background: #ffffff; border: 1px solid rgb(226 232 240); }
        .tag { color: white; }
        .ok { color: var(--ink-body); background: transparent; }
    </style>
</head>
<body>
<!-- 걸린다: 속성에 박은 색 -->
<p style="color:#1e293b">본문</p>
<div style="background: hsl(210 40% 98%)">칸</div>
<!-- 안 걸린다: 그림 · 색이 내용인 섬 · 색이 아닌 style -->
<svg viewBox="0 0 10 10"><rect fill="#f97316" style="stroke:#000000" width="10" height="10"/></svg>
<table data-keep-color>
    <tr><td style="background:#1e3a8a;color:#fff">1</td></tr>
</table>
<div style="min-width:576px">넓은 칸</div>
</body>
</html>
